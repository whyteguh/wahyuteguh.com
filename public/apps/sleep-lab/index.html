<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sleep Lab</title>
<meta name="description" content="A pocket almanac of sleep tools — age, bedtime, debt, chronotype, daytime sleepiness, polyphasic schedules, caffeine, hygiene and a wind-down. Every number with its paper trail."/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        theme: { extend: { colors: {
            cream: 'rgb(var(--c-cream) / <alpha-value>)', 'cream-dark': 'rgb(var(--c-cream-dark) / <alpha-value>)',
            earth: 'rgb(var(--c-earth) / <alpha-value>)', 'earth-light': 'rgb(var(--c-earth-light) / <alpha-value>)',
            'earth-dark': 'rgb(var(--c-earth-dark) / <alpha-value>)', charcoal: 'rgb(var(--c-charcoal) / <alpha-value>)',
            'charcoal-mid': 'rgb(var(--c-charcoal-mid) / <alpha-value>)', stone: 'rgb(var(--c-stone) / <alpha-value>)',
            accent: 'rgb(var(--c-accent) / <alpha-value>)', surface: 'rgb(var(--c-surface) / <alpha-value>)'
        }, fontFamily: { serif: ['Caveat','cursive'], hand: ['Caveat','cursive'], sans: ['Courier Prime','monospace'] } } }
    }
</script>

<style>
:root{
  --c-cream:251 250 246; --c-cream-dark:240 235 225; --c-earth:139 111 71; --c-earth-light:196 168 130;
  --c-earth-dark:92 69 48; --c-charcoal:43 41 37; --c-charcoal-mid:74 69 64; --c-stone:154 147 144;
  --c-accent:179 67 43; --c-surface:255 255 255;
}
html.dark{
  --c-cream:27 25 21; --c-cream-dark:69 63 52; --c-earth:196 168 130; --c-earth-light:214 190 150;
  --c-earth-dark:214 190 150; --c-charcoal:230 225 211; --c-charcoal-mid:164 157 141; --c-stone:124 118 106;
  --c-accent:224 122 95; --c-surface:55 51 43;
}
*{box-sizing:border-box}
body{
  font-family:'Courier Prime',monospace; background-color:rgb(var(--c-cream)); color:rgb(var(--c-charcoal));
  background-image:radial-gradient(circle, rgba(139,111,71,.18) 1px, transparent 1.2px); background-size:22px 22px;
  transition:background-color .5s ease,color .5s ease; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
}
html.dark body{background-image:radial-gradient(circle, rgba(196,168,130,.12) 1px, transparent 1.2px)}
.serif{font-family:'Caveat',cursive}
::selection{background:rgb(var(--c-accent));color:rgb(var(--c-cream))}
:focus-visible{outline:2px solid rgb(var(--c-accent));outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:rgb(var(--c-cream))}
::-webkit-scrollbar-thumb{background:rgb(var(--c-cream-dark));border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:rgb(var(--c-stone))}

/* layout */
.shell{max-width:1000px;margin:0 auto;padding:0 18px 60px}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 2px 14px}
.eyebrow{display:flex;align-items:center;gap:9px;font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgb(var(--c-stone))}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:rgb(var(--c-earth))}
h1{font-family:'Caveat',cursive;font-weight:700;font-size:clamp(2.6rem,7vw,3.6rem);line-height:1;margin-top:4px;transform:rotate(-1deg)}

/* tab strip */
.tabbar{position:sticky;top:0;z-index:40;margin:0 -18px;padding:10px 18px;
  background:rgb(var(--c-cream) / .88);backdrop-filter:blur(10px);border-bottom:1px solid rgb(var(--c-cream-dark));
  transition:background-color .5s ease}
html.dark .tabbar{background:rgb(var(--c-cream) / .9)}
.tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid transparent;background:rgb(var(--c-cream-dark) / .55);color:rgb(var(--c-stone));
  font:700 11px/1 'Courier Prime',monospace;letter-spacing:.06em;text-transform:uppercase;padding:9px 14px;border-radius:999px;cursor:pointer;transition:.18s}
.tab:hover{color:rgb(var(--c-charcoal));background:rgb(var(--c-cream-dark))}
.tab.on{background:rgb(var(--c-charcoal));color:rgb(var(--c-cream));border-color:rgb(var(--c-charcoal))}
.tab .n{opacity:.55;margin-right:5px}

/* panel */
.panel-wrap{position:relative;margin-top:20px;overflow:hidden}
.panel{animation:panelIn .32s cubic-bezier(.2,.9,.3,1)}
@keyframes panelIn{from{opacity:0;transform:translateX(var(--dir,14px))}}
.panel-head{margin-bottom:20px}
.panel-head .k{font:700 10px/1 'Courier Prime',monospace;letter-spacing:.2em;text-transform:uppercase;color:rgb(var(--c-earth))}
.panel-head h2{font-family:'Caveat',cursive;font-weight:600;font-size:clamp(1.7rem,4.4vw,2.3rem);line-height:1.08;margin:7px 0 6px}
.panel-head p{font-size:13px;line-height:1.6;color:rgb(var(--c-stone));max-width:62ch}
.pane{position:relative;background:rgb(var(--c-surface));border:1px solid rgb(var(--c-cream-dark));border-radius:22px;padding:clamp(18px,3.4vw,30px);box-shadow:0 1px 3px rgb(var(--c-charcoal) / .04)}
.sub{font:700 10px/1 'Courier Prime',monospace;letter-spacing:.18em;text-transform:uppercase;color:rgb(var(--c-stone));margin-bottom:11px}
.toolref{margin-top:22px;padding-top:13px;border-top:1px dashed rgb(var(--c-cream-dark));font-size:11.5px;color:rgb(var(--c-stone))}
.toolref a{color:rgb(var(--c-earth));text-decoration:none;border-bottom:1px dotted rgb(var(--c-stone) / .6)}
.toolref a:hover{color:rgb(var(--c-accent))}

/* generic controls */
.btn{font:700 11px/1 'Courier Prime',monospace;letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;border-radius:999px;border:1px solid rgb(var(--c-charcoal) / .4);background:none;color:rgb(var(--c-charcoal));cursor:pointer;transition:.18s}
.btn:hover{border-color:rgb(var(--c-charcoal));background:rgb(var(--c-charcoal));color:rgb(var(--c-cream))}
.btn.solid{background:rgb(var(--c-earth));border-color:rgb(var(--c-earth));color:rgb(var(--c-cream))}
.btn.solid:hover{background:rgb(var(--c-earth-dark));border-color:rgb(var(--c-earth-dark));color:rgb(var(--c-cream))}
.btn.ghost{border-color:transparent;color:rgb(var(--c-stone));padding-left:6px;padding-right:6px}
.btn.ghost:hover{color:rgb(var(--c-charcoal));background:rgb(var(--c-cream-dark) / .5)}
.btn-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid rgb(var(--c-cream-dark));border-radius:999px;overflow:hidden;flex-wrap:wrap;background:rgb(var(--c-cream) / .5)}
.seg button{padding:9px 15px;background:none;border:0;color:rgb(var(--c-stone));font:700 11px 'Courier Prime',monospace;letter-spacing:.04em;cursor:pointer;transition:.18s}
.seg button+button{border-left:1px solid rgb(var(--c-cream-dark))}
.seg button:hover{color:rgb(var(--c-charcoal))}
.seg button[aria-pressed="true"]{background:rgb(var(--c-earth));color:rgb(var(--c-cream))}
.seg.sm button{padding:6px 11px;font-size:10px}
select,input[type=time],input[type=number]{background:rgb(var(--c-cream));border:1px solid rgb(var(--c-cream-dark));color:rgb(var(--c-charcoal));border-radius:10px;padding:8px 11px;font:500 13px 'Courier Prime',monospace}
select{cursor:pointer}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field span{font-size:11px;color:rgb(var(--c-stone))}
.field span b{color:rgb(var(--c-earth))}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:26px;width:100%;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:rgb(var(--c-cream-dark));border-radius:9px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:rgb(var(--c-surface));border:3px solid rgb(var(--c-earth));margin-top:-8px;box-shadow:0 1px 4px rgb(var(--c-charcoal) / .2)}
input[type=range]::-moz-range-track{height:4px;background:rgb(var(--c-cream-dark));border-radius:9px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:rgb(var(--c-surface));border:3px solid rgb(var(--c-earth))}
.ctl-l{font:700 10.5px/1 'Courier Prime',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgb(var(--c-stone))}
.stat-num{font-family:'Caveat',cursive;font-weight:600;font-size:clamp(2.6rem,6vw,3.6rem);color:rgb(var(--c-earth));line-height:1}
.stat-num.sm{font-size:1.9rem}
.stat-num small{font:400 .9rem 'Courier Prime',monospace;color:rgb(var(--c-stone));margin-left:4px}

/* verdict boxes */
.verdict{margin:14px 0;padding:13px 15px;border-left:3px solid rgb(var(--c-accent));background:rgb(var(--c-accent) / .06);border-radius:0 12px 12px 0;font-size:12.5px;line-height:1.55;color:rgb(var(--c-charcoal))}
.verdict strong{display:block;margin-bottom:2px;font-family:'Caveat',cursive;font-weight:600;font-size:1.25rem;color:rgb(var(--c-charcoal))}
.verdict.v-sage{border-color:rgb(var(--c-earth));background:rgb(var(--c-earth) / .09)}
.recovery{color:rgb(var(--c-stone));font-size:12px;margin-top:10px;line-height:1.55}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:rgb(var(--c-stone))}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sw-rec{background:rgb(var(--c-earth))}.sw-may{background:rgb(var(--c-earth) / .32)}.sw-nr{background:rgb(var(--c-cream-dark));outline:1px solid rgb(var(--c-cream-dark))}

/* 01 age */
.age-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(22px,4vw,46px);align-items:center}
.stage-name{font-family:'Caveat',cursive;font-weight:600;font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.05;margin-top:14px}
.stage-ages{color:rgb(var(--c-earth));font-size:13px;margin:2px 0 18px}
.stage-note{margin-top:18px;color:rgb(var(--c-stone));font-size:12.5px;line-height:1.6;border-left:2px solid rgb(var(--c-cream-dark));padding-left:13px;min-height:3em}
.stage-ticks{display:flex;justify-content:space-between;margin-top:2px}
.stage-ticks button{flex:1;background:none;border:0;color:rgb(var(--c-stone));font:700 9.5px 'Courier Prime',monospace;padding:7px 0 0;cursor:pointer;transition:.2s}
.stage-ticks button:hover,.stage-ticks button.on{color:rgb(var(--c-earth))}
.band{position:relative;height:38px;border-radius:10px;overflow:hidden;margin-top:6px;background:rgb(var(--c-cream))}
.band-seg{position:absolute;top:0;bottom:0;transition:left .5s ease,width .5s ease}
.b-nr{background:rgb(var(--c-cream-dark) / .5)}
.b-may{background:rgb(var(--c-earth) / .3)}
.b-rec{background:rgb(var(--c-earth));display:flex;align-items:center;justify-content:center}
.b-rec span{color:rgb(var(--c-cream));font-weight:700;font-size:12px;white-space:nowrap}
.band-axis{display:flex;justify-content:space-between;font-size:10px;color:rgb(var(--c-stone));margin-top:6px}
.year-fact{margin-top:16px;color:rgb(var(--c-stone));font-size:12px;line-height:1.55;border-left:2px solid rgb(var(--c-cream-dark));padding-left:13px}

/* 02 bedtime */
.bt-grid{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:clamp(20px,4vw,44px);align-items:start}
#dial{width:min(360px,88vw);margin:0 auto;display:block;touch-action:none;user-select:none;cursor:grab}
#dial:active{cursor:grabbing}
.tk{stroke:rgb(var(--c-stone) / .35)}
.tk.mj{stroke:rgb(var(--c-charcoal) / .45);stroke-width:1.6}
.tk-l{fill:rgb(var(--c-stone));font-size:11px}
.dial-guide{fill:none;stroke:rgb(var(--c-stone) / .3);stroke-dasharray:2 5}
#dialHand{stroke:rgb(var(--c-charcoal) / .8);stroke-width:2;stroke-linecap:round}
.knob-ring{fill:rgb(var(--c-surface));stroke:rgb(var(--c-earth));stroke-width:2}
.knob-dot{fill:rgb(var(--c-earth))}
.dial-time{font-family:'Caveat',cursive;font-weight:600;font-size:44px;fill:rgb(var(--c-charcoal))}
.dial-cap{font:700 9.5px 'Courier Prime',monospace;letter-spacing:.2em;fill:rgb(var(--c-stone));text-transform:uppercase}
.cand circle{fill:rgb(var(--c-surface));stroke:rgb(var(--c-stone) / .5);cursor:pointer;transition:.2s}
.cand text{fill:rgb(var(--c-stone));font:700 11px 'Courier Prime',monospace;pointer-events:none}
.cand:hover circle{stroke:rgb(var(--c-earth))}
.cand.sel circle{fill:rgb(var(--c-earth));stroke:rgb(var(--c-earth))}
.cand.sel text{fill:rgb(var(--c-cream))}
.cand-link{stroke:rgb(var(--c-accent));stroke-dasharray:3 4;opacity:.55}
.dial-hint{text-align:center;color:rgb(var(--c-stone));font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-top:8px}
.dial-compass{font:700 11px 'Courier Prime',monospace;fill:rgb(var(--c-charcoal-mid));letter-spacing:.05em}
.bt-howto{display:grid;gap:9px;margin-top:18px;padding-top:16px;border-top:1px dashed rgb(var(--c-cream-dark))}
.bt-howto>div{display:flex;gap:11px;align-items:flex-start}
.bt-howto b{flex:none;width:20px;height:20px;border-radius:50%;background:rgb(var(--c-earth));color:rgb(var(--c-cream));display:grid;place-items:center;font:700 11px 'Courier Prime',monospace;margin-top:1px}
.bt-howto span{font-size:12.5px;line-height:1.55;color:rgb(var(--c-stone))}
.bt-howto em{font-style:normal;color:rgb(var(--c-earth))}
.bt-controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.bt-controls .ctl-l{margin-right:auto}
.cyc-row{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;background:none;border:1px solid rgb(var(--c-cream-dark));border-radius:12px;padding:11px 15px;margin-top:8px;color:rgb(var(--c-charcoal));cursor:pointer;font-family:inherit;transition:.18s}
.cyc-row:hover{border-color:rgb(var(--c-earth))}
.cyc-row.sel{border-color:rgb(var(--c-earth));background:rgb(var(--c-earth) / .08)}
.cyc-time{font-family:'Caveat',cursive;font-weight:600;font-size:1.45rem;color:rgb(var(--c-earth));min-width:70px}
.cyc-info{color:rgb(var(--c-stone));font-size:12px}
.cyc-tag{margin-left:auto;font:700 9px 'Courier Prime',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgb(var(--c-stone));border:1px solid rgb(var(--c-cream-dark));padding:2px 8px;border-radius:999px;white-space:nowrap}
.hypno-wrap{margin-top:26px;border-top:1px dashed rgb(var(--c-cream-dark));padding-top:20px}
.hypno{overflow-x:auto}
.hypno svg{min-width:620px;width:100%;height:auto;display:block}
.hypno text{font:10px 'Courier Prime',monospace;fill:rgb(var(--c-stone))}
.hyp-no{stroke:rgb(var(--c-charcoal) / .85);fill:none;stroke-width:2;stroke-linejoin:round}
.hyp-rem{stroke:rgb(var(--c-accent));stroke-width:5;stroke-linecap:round}
.hyp-lat{fill:rgb(var(--c-cream-dark) / .5)}
.hyp-cyc{stroke:rgb(var(--c-stone) / .35);stroke-dasharray:3 4}

/* 03 debt */
.debt-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:clamp(22px,4vw,44px)}
.debt-need-row{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.debt-inner{min-width:560px}
.debt-bars{display:flex;gap:10px;height:180px;position:relative;padding-top:16px}
.dbar{flex:1;position:relative;background:rgb(var(--c-cream));border:1px solid rgb(var(--c-cream-dark));border-radius:6px 6px 0 0;overflow:hidden}
.dfill{position:absolute;left:0;right:0;bottom:0;background:rgb(var(--c-earth));transition:height .5s ease}
.ddef{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,rgb(var(--c-accent) / .5) 0 3px,transparent 3px 6px);transition:height .5s,bottom .5s}
.target-line{position:absolute;left:-8px;right:-8px;border-top:1.5px dashed rgb(var(--c-earth));z-index:2;transition:bottom .5s}
.target-line span{position:absolute;right:2px;top:-17px;font:700 9.5px 'Courier Prime',monospace;letter-spacing:.12em;text-transform:uppercase;color:rgb(var(--c-earth))}
.debt-days,.debt-vals,.debt-sliders{display:flex;gap:10px;margin-top:8px}
.debt-days div,.debt-vals div{flex:1;text-align:center}
.debt-days span{font:700 10px 'Courier Prime',monospace;letter-spacing:.12em;text-transform:uppercase;color:rgb(var(--c-stone))}
.debt-vals span{font-size:12px;color:rgb(var(--c-charcoal-mid))}
.debt-sliders div{flex:1;display:flex;justify-content:center}
.debt-sliders input{width:92%}
.debt-chart-scroll{overflow-x:auto}
.battery{display:flex;gap:15px;align-items:center;margin:20px 0}
.batt-shell{width:52px;height:110px;border:1px solid rgb(var(--c-charcoal) / .4);border-radius:12px;position:relative;flex:none}
.batt-shell::after{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:18px;height:6px;background:rgb(var(--c-charcoal) / .4);border-radius:3px 3px 0 0}
.batt-fill{position:absolute;left:4px;right:4px;bottom:4px;background:rgb(var(--c-earth));border-radius:8px;transition:height .8s cubic-bezier(.22,1,.36,1),background .4s}
.batt-meta{display:flex;flex-direction:column;gap:4px}
.batt-meta span:first-child{font-family:'Caveat',cursive;font-weight:600;font-size:1.9rem;color:rgb(var(--c-charcoal))}
.batt-meta .ctl-l{font-size:10px}

/* 04 chronotype */
.q-shell{max-width:680px;margin:0 auto}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.q-dots{display:flex;gap:8px}
.q-dots span{width:11px;height:11px;border-radius:50%;border:1px solid rgb(var(--c-cream-dark));transition:.3s}
.q-dots span.done{background:rgb(var(--c-earth));border-color:rgb(var(--c-earth))}
.q-dots span.cur{box-shadow:0 0 0 4px rgb(var(--c-earth) / .15);border-color:rgb(var(--c-earth))}
.qcard h3{font-family:'Caveat',cursive;font-weight:600;font-size:clamp(1.3rem,3.2vw,1.7rem);margin-bottom:16px;line-height:1.25}
.opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:12px 15px;margin-bottom:8px;background:none;border:1px solid rgb(var(--c-cream-dark));border-radius:12px;color:rgb(var(--c-charcoal));font:400 13px 'Courier Prime',monospace;cursor:pointer;transition:.18s}
.opt:hover{border-color:rgb(var(--c-earth));transform:translateX(5px)}
.opt .dot{width:9px;height:9px;border-radius:50%;border:1px solid rgb(var(--c-stone));flex:none;transition:.18s}
.opt:hover .dot{border-color:rgb(var(--c-earth));background:rgb(var(--c-earth) / .2)}
.q-anim{animation:qin .4s ease}
@keyframes qin{from{opacity:0;transform:translateX(16px)}}
.qres-top{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.qres-name{font-family:'Caveat',cursive;font-weight:600;font-size:clamp(2.2rem,6vw,3.2rem);color:rgb(var(--c-earth));line-height:1}
.qres-desc{color:rgb(var(--c-stone));margin:14px 0;font-size:13px;line-height:1.6;max-width:58ch}
.qres-window{margin:0 0 6px;padding:11px 15px;border:1px dashed rgb(var(--c-cream-dark));border-radius:12px;display:inline-block;font-size:12px}
.qres-window b{font-family:'Caveat',cursive;font-size:1.2rem;color:rgb(var(--c-charcoal));font-weight:600}
.tips{margin:14px 0;list-style:none}
.tips li{padding:6px 0 6px 24px;position:relative;color:rgb(var(--c-stone));font-size:12.5px;line-height:1.55}
.tips li::before{content:"";position:absolute;left:2px;top:13px;width:7px;height:7px;border:1px solid rgb(var(--c-earth));transform:rotate(45deg)}
.q-caveat{font-size:11px;color:rgb(var(--c-stone));margin-top:12px}
#qBack{margin-top:10px}
#qBack[hidden]{visibility:hidden}

/* 05 epworth */
.epw-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(22px,4vw,44px);align-items:start}
.epw-legend{font-size:11.5px;color:rgb(var(--c-stone));margin-bottom:14px}
.epw-legend b{color:rgb(var(--c-earth))}
.epw-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed rgb(var(--c-cream-dark))}
.epw-q{font-size:12.5px;color:rgb(var(--c-charcoal));flex:1}
.epw-q i{color:rgb(var(--c-stone));font-style:normal;margin-right:6px}
.epw-opts{display:flex;gap:6px;flex:none}

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const mod=(a,n)=>((a%n)+n)%n, pad=n=>String(n).padStart(2,'0');
const fmtClock=m=>{m=mod(Math.round(m),1440);return pad(Math.floor(m/60))+':'+pad(m%60);};
const fmtH=h=>{const t=Math.round(h*60);if(t===0)return'0h';const hh=Math.floor(t/60),mm=t%60;return hh?(mm?hh+'h '+mm+'m':hh+'h'):mm+'m';};
const ez=p=>.5-.5*Math.cos(Math.PI*Math.min(1,Math.max(0,p)));
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3000);}
const store={get(k,d){try{const v=localStorage.getItem('wt-sleep-'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('wt-sleep-'+k,JSON.stringify(v));}catch(e){}}};

/* ================= shared data ================= */
const STAGES=[
 {label:'Newborn',ages:'0–3 months',rec:[14,17],may:[11,13],or:[18,19],note:'Newborns sleep in 2–4 hour bouts around the clock, with no respect whatsoever for your schedule.'},
 {label:'Infant',ages:'4–11 months',rec:[12,15],may:[10,11],or:[16,18],note:'Night feeds fragment things. The total across 24 hours is what counts, not the longest stretch.'},
 {label:'Toddler',ages:'1–2 years',rec:[11,14],may:[9,10],or:[15,16],note:'Naps shrink from two to one. Bedtime resistance begins its long and storied reign.'},
 {label:'Preschooler',ages:'3–5 years',rec:[10,13],may:[8,9],or:[14,15],note:'The last years where an afternoon nap is still on the menu. Enjoy it while it lasts.'},
 {label:'School age',ages:'6–13 years',rec:[9,11],may:[7,8],or:[12,12],note:'Screens and early school bells start competing for exactly the same hours.'},
 {label:'Teenager',ages:'14–17 years',rec:[8,10],may:[7,7],or:[11,11],note:'Biology shifts teens later by up to two hours. The school bell, famously, does not shift.'},
 {label:'Young adult',ages:'18–25 years',rec:[7,9],may:[6,6],or:[10,11],note:'The classic 7-to-9 window opens here and, for most people, never closes again.'},
 {label:'Adult',ages:'26–64 years',rec:[7,9],may:[6,6],or:[10,10],note:'Quality starts to matter as much as quantity — deep sleep thins slowly with each decade.'},
 {label:'Older adult',ages:'65+ years',rec:[7,8],may:[5,6],or:[9,9],note:'Sleep gets lighter and more fragmented, but the need itself never retires.'}
];
const needMid=st=>(st.rec[0]+st.rec[1])/2;
const S={stageIdx:store.get('stage',7),polyIdx:0,polyOff:0};

const TOOLS=[
 {id:'age',label:'Age'},{id:'bedtime',label:'Bedtime'},{id:'debt',label:'Debt'},{id:'chronotype',label:'Chronotype'},
 {id:'doze',label:'Doze'},{id:'polyphasic',label:'Polyphasic'},{id:'caffeine',label:'Caffeine'},{id:'hygiene',label:'Hygiene'},
 {id:'breathe',label:'Breathe'},{id:'papers',label:'Papers'}
];
let current=TOOLS.findIndex(t=>t.id===store.get('tool','age'));
if(current<0)current=0;

/* ================= nav + swipe ================= */
function buildTabs(){
  $('#tabs').innerHTML=TOOLS.map((t,i)=>'<button class="tab'+(i===current?' on':'')+'" data-i="'+i+'"><span class="n">'+pad(i+1)+'</span>'+t.label+'</button>').join('');
}
function go(i,dir){
  current=(i+TOOLS.length)%TOOLS.length;
  store.set('tool',TOOLS[current].id);
  const p=$('#panel');p.style.setProperty('--dir',(dir==='left'?-1:1)*16+'px');
  buildTabs();
  render();
  const tab=$('#tabs .tab.on');if(tab&&tab.scrollIntoView)tab.scrollIntoView({inline:'center',block:'nearest',behavior:reduced?'auto':'smooth'});
  window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)go(+b.dataset.i);});
(function swipe(){
  const w=$('.panel-wrap');let x0=null,y0=null,lock=null;
  w.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;x0=e.touches[0].clientX;y0=e.touches[0].clientY;lock=null;},{passive:true});
  w.addEventListener('touchmove',e=>{
    if(x0==null)return;const dx=e.touches[0].clientX-x0,dy=e.touches[0].clientY-y0;
    if(lock===null&&(Math.abs(dx)>8||Math.abs(dy)>8))lock=Math.abs(dx)>Math.abs(dy)?'x':'y';
  },{passive:true});
  w.addEventListener('touchend',e=>{
    if(x0==null)return;const t=e.changedTouches[0];const dx=t.clientX-x0,dy=t.clientY-y0;
    if(lock==='x'&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)go(current+(dx<0?1:-1),dx<0?'left':'right');
    x0=y0=null;lock=null;
  },{passive:true});
})();
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t&&t.matches&&t.matches('input,select,textarea,button'))return;
  if(e.key==='ArrowRight')go(current+1,'left');
  else if(e.key==='ArrowLeft')go(current-1,'right');
});

/* ================= helpers for panels ================= */

/* ================= 01 · age ================= */
function renderAge(){
  const st=STAGES[S.stageIdx];
  const shorts=['newborn','infant','toddler','pre-k','school','teen','18–25','26–64','65+'];
  $('#panel').innerHTML=head('01 · How much','How much sleep does <em>your age</em> need?','The most-cited answer comes from a 2015 National Sleep Foundation panel that sifted 320 studies to put a figure on every stage of life. Drag through yours.')
  +pane('<div class="age-grid">'
   +'<div><p class="sub">drag through a life</p>'
   +'<div class="stage-name">'+st.label+'</div><div class="stage-ages">'+st.ages+'</div>'
   +'<input type="range" id="ageRange" min="0" max="8" step="1" value="'+S.stageIdx+'" aria-label="Life stage">'
   +'<div class="stage-ticks">'+shorts.map((s,i)=>'<button type="button" data-i="'+i+'" class="'+(i===S.stageIdx?'on':'')+'">'+s+'</button>').join('')+'</div>'
   +'<p class="stage-note">'+st.note+'</p></div>'
   +'<div><p class="sub">recommended in 24 hours</p>'
   +'<div class="stat-num" id="stageHours">'+st.rec[0]+'–'+st.rec[1]+'</div>'
   +'<div class="ctl-l" style="margin:6px 0 14px">hours per day · naps included</div>'
   +'<div class="band"><div class="band-seg b-nr" id="bL" style="left:0"></div><div class="band-seg b-may" id="bLo"></div><div class="band-seg b-rec" id="bRec"><span id="bRecTxt">'+st.rec[0]+'–'+st.rec[1]+'h</span></div><div class="band-seg b-may" id="bHi"></div><div class="band-seg b-nr" id="bR" style="right:0"></div></div>'
   +'<div class="band-axis"><span>0h</span><span>5</span><span>10</span><span>15</span><span>20h</span></div>'
   +'<div class="legend"><span><i class="sw sw-rec"></i>recommended</span><span><i class="sw sw-may"></i>may be appropriate</span><span><i class="sw sw-nr"></i>not recommended</span></div>'
   +'<p class="year-fact">At the middle of your range, that\u2019s '+Math.round(needMid(st)*365).toLocaleString('en-US')+' hours a year — about '+Math.round(needMid(st)*365/24)+' full days spent asleep.</p>'
   +'</div></div>')
  +ref('Grounded in Hirshkowitz et al., 2015 and the AASM/SRS consensus, Watson et al., 2015. Other tools read your stage from here.');
  const pc=v=>(v/20*100)+'%';
  $('#bL').style.width=pc(st.may[0]);
  $('#bLo').style.left=pc(st.may[0]);$('#bLo').style.width=pc(st.rec[0]-st.may[0]);
  $('#bRec').style.left=pc(st.rec[0]);$('#bRec').style.width=pc(st.rec[1]-st.rec[0]);
  $('#bHi').style.left=pc(st.rec[1]);$('#bHi').style.width=pc(st.or[1]-st.rec[1]);
  $('#bR').style.width=pc(20-st.or[1]);
  bind('#ageRange','input',e=>{S.stageIdx=+e.target.value;store.set('stage',S.stageIdx);renderAge();});
  $('#panel').querySelectorAll('.stage-ticks button').forEach(b=>b.addEventListener('click',()=>{S.stageIdx=+b.dataset.i;store.set('stage',S.stageIdx);renderAge();}));
}

/* ================= 02 · bedtime ================= */
const BT={anchor:store.get('btAnchor',390),latency:store.get('btLat',15),k:5,mode:store.get('btMode','wake'),dragging:false};
const KS=[6,5,4,3];
function btCands(){return KS.map(k=>({k,mins:BT.mode==='wake'?mod(BT.anchor-(k*90+BT.latency),1440):mod(BT.anchor+(k*90+BT.latency),1440)}));}
function hypnoSVG(k,bedMin,lat){
  const W=680,H=172,L=46,R=16,T=24,B=32,pw=W-L-R,ph=H-T-B;
  const yM={W:0,REM:.2,N1:.44,N2:.66,N3:.92},y=s=>T+yM[s]*ph;
  const total=k*90+lat,x=m=>L+m/total*pw,segs=[];
  for(let i=0;i<k;i++){

const EPW_Q=['Sitting and reading','Watching TV','Sitting inactive in a public place — a theatre, a meeting','As a passenger in a car for an hour without a break','Lying down in the afternoon, when circumstances permit','Sitting and talking to someone','Sitting quietly after lunch, without alcohol','In a car stopped for a few minutes in traffic'];
let epw=Array(8).fill(null);
function epwVerdict(s){
  if(s<=5)return['Politely awake.','Lower than average daytime sleepiness. The afternoon holds no danger for you.'];
  if(s<=10)return['The human condition.','Normal daytime sleepiness — this is where most of the bell curve lives.'];
  if(s<=12)return['Mild excessive sleepiness.','Worth watching, especially behind the wheel or in the afternoon.'];
  if(s<=15)return['Moderate — see someone.','This level deserves a conversation with a clinician. The Epworth was built for exactly that conversation.'];
  return['Severe — please see someone.','Scores this high are strongly associated with disorders like sleep apnea and narcolepsy. Bring this number to a doctor.'];
}
function renderDoze(){
  $('#panel').innerHTML=head('05 · How sleepy','How sleepy is <em>too sleepy?</em>','The Epworth Sleepiness Scale is the eight-question yardstick clinicians actually use for daytime dozing. Answer honestly — nobody\u2019s watching.')

   +'<div class="epw-side"><svg id="epwGauge" viewBox="0 0 320 200" aria-hidden="true"></svg><div class="stat-num" id="epwScore">0</div><div class="ctl-l" id="epwStatus">0 of 8 answered</div><div class="verdict" id="epwVerdict"></div></div></div>')
  +ref('The Epworth Sleepiness Scale, Johns, 1991. A score of 11 or higher is the usual threshold for a conversation with a clinician.');

    b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));epwUpdate();});

function epwBuild(){

  g.gain.setValueAtTime(.0001,AC.currentTime);g.gain.exponentialRampToValueAtTime(vol,AC.currentTime+.06);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);

  $('#orbRingC').style.strokeDashoffset=(C*(1-p)).toFixed(1);
  if(idx!==BR.lastPhase){BR.lastPhase=idx;chime(type==='in'?392:type==='hold'?329.63:261.63,.35,.05);}
  BR.raf=requestAnimationFrame(brTick);
}
function renderBreathe(){
  $('#panel').innerHTML=head('09 · Wind-down','One last thing <em>before bed.</em>','Slow breathing is the cheapest sedative on earth. Follow the orb — it knows the way down.')
  +pane('<div class="br-stage"><div class="seg" id="brMode"><button data-m="478" aria-pressed="true">4-7-8</button><button data-m="box" aria-pressed="false">Box</button><button data-m="sigh" aria-pressed="false">Physiological sigh</button></div>'
   +'<div class="orb-stage"><svg class="orb-ring" viewBox="0 0 320 320"><circle id="orbRingC" cx="160" cy="160" r="150"/></svg><div class="orb-core" id="orbCore"><div class="orb-label" id="orbLabel">ready?</div><div class="orb-count" id="orbCount"></div></div></div>'
   +'<div class="btn-row" style="justify-content:center"><button class="btn solid" id="brStart"><svg id="brIcPlay" width="13" height="13" style="vertical-align:-2px"><use href="#i-play"/></svg><svg id="brIcPause" width="13" height="13" style="vertical-align:-2px;display:none"><use href="#i-pause"/></svg><span id="brBtnTxt">begin</span></button>'
   +'<button class="btn ghost" id="brSound" aria-label="Toggle chimes" title="Toggle chimes"><svg id="sndIc" width="14" height="14"><use href="#i-vol"/></svg></button></div>'
   +'<p class="br-desc" id="brDesc"></p><p class="br-stats ctl-l" id="brStats"></p></div>')
  +ref('The 4-7-8 pattern popularized by Dr. Andrew Weil; the physiological sigh is the fastest known voluntary down-shift of arousal.');
  $('#brMode').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{if(BR.on)brStop();brSetMode(b.dataset.m);
    $('#brMode').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));}));
  brSetMode('478');
  $('#brStart').addEventListener('click',()=>{if(!BR.on)brStart();else brStop();});
  $('#brSound').addEventListener('click',()=>{BR.chime=!BR.chime;
    $('#sndIc').innerHTML='<use href="'+(BR.chime?'#i-vol':'#i-voloff')+'"/>';toast(BR.chime?'Chimes on.':'Chimes off.');if(BR.chime)chime(392,.3,.05);});
}
function brStart(){
  BR.on=true;BR.start=performance.now();BR.cycles=0;BR.lastPhase=-1;
  $('#brIcPlay').style.display='none';$('#brIcPause').style.display='inline';$('#brBtnTxt').textContent='stop';
  BR.raf=requestAnimationFrame(brTick);
}
function brStop(){
  if(!BR.on)return;BR.on=false;if(BR.raf)cancelAnimationFrame(BR.raf);
  const secs=Math.round((performance.now()-BR.start)/1000);
  const oc=$('#orbCore');if(oc)oc.style.transform='scale(.55)';
  const l=$('#orbLabel');if(l)l.textContent='ready?';
  const c=$('#orbCount');if(c)c.textContent='';
  $('#brIcPlay').style.display='inline';$('#brIcPause').style.display='none';$('#brBtnTxt').textContent='begin';
  $('#brStats').textContent=BR.cycles+' cycle'+(BR.cycles===1?'':'s')+' · '+Math.floor(secs/60)+'m '+pad(secs%60)+'s';
  toast(BR.cycles+' cycles of '+BRM[BR.mode].name+' — well breathed.');
}
function brCleanup(){if(BR.on){BR.on=false;if(BR.raf)cancelAnimationFrame(BR.raf);}}

/* ================= 10 · papers ================= */

 ['Watson NF, Badr MS, Belenky G, et al.','Recommended amount of sleep for a healthy adult: a joint consensus statement of the AASM and Sleep Research Society. <em>Sleep</em>. 2015;38(6):843–844.','https://pubmed.ncbi.nlm.nih.gov/?term=Watson+recommended+amount+of+sleep+healthy+adult'],
 ['Dement W, Kleitman N.','Cyclic variations in EEG during sleep and their relation to eye movements, body motility, and dreaming. <em>Electroencephalogr Clin Neurophysiol</em>. 1957;9(4):673–690.','https://pubmed.ncbi.nlm.nih.gov/?term=Dement+Kleitman+cyclic+variations'],
 ['Van Dongen HPA, Maislin G, Mullington JM, Dinges DF.','The cumulative cost of additional wakefulness: dose-response effects on neurobehavioral functions and sleep physiology from chronic sleep restriction. <em>Sleep</em>. 2003;26(2):117–126.','https://pubmed.ncbi.nlm.nih.gov/?term=Van+Dongen+cumulative+cost+additional+wakefulness'],
 ['Johns MW.','A new method for measuring daytime sleepiness: the Epworth Sleepiness Scale. <em>Sleep</em>. 1991;14(6):540–545.','https://pubmed.ncbi.nlm.nih.gov/?term=Johns+Epworth+sleepiness+scale+new+method'],
 ['Adan A, Almirall H.','Horne &amp; Östberg morningness–eveningness questionnaire: a reduced scale. <em>Personality and Individual Differences</em>. 1991;12(3):241–253.','https://pubmed.ncbi.nlm.nih.gov/?term=Adan+Almirall+morningness+eveningness+reduced'],
 ['Brooks A, Lack L.','A brief afternoon nap following nocturnal sleep restriction: which nap duration is most recuperative? <em>Sleep</em>. 2006;29(6):831–840.','https://pubmed.ncbi.nlm.nih.gov/?term=Brooks+Lack+afternoon+nap+recuperative'],
 ['Drake C, Roehrs T, Shambroom J, Roth T.','Caffeine effects on sleep taken 0, 3, or 6 hours before going to bed. <em>J Clin Sleep Med</em>. 2013;9(11):1195–1200.','https://pubmed.ncbi.nlm.nih.gov/?term=Drake+caffeine+effects+on+sleep+taken'],
 ['Fredholm BB, Bättig K, Holmén J, Nehlig A, Zvartau EE.','Actions of caffeine in the brain with special reference to factors that contribute to its widespread use. <em>Pharmacol Rev</em>. 1999;51(1):83–133.','https://pubmed.ncbi.nlm.nih.gov/?term=Fredholm+actions+of+caffeine+in+the+brain'],
 ['Stampi C.','Why We Nap: Evolution, Chronobiology, and Functions of Polyphasic and Ultrashort Sleep. <em>Birkhäuser</em>. 1992.','https://pubmed.ncbi.nlm.nih.gov/?term=Stampi+why+we+nap']
];
function renderPapers(){
  $('#panel').innerHTML=head('§ · Sources','The <em>paper</em> trail.','Every figure in this lab traces back to something peer-reviewed — or, for the polyphasic extremes, is flagged as folklore on purpose.')
  +pane('<ol class="refs">'+REFS.map(r=>'<li><strong>'+r[0]+'</strong> '+r[1]+'<a href="'+r[2]+'" target="_blank" rel="noopener">PubMed ↗</a></li>').join('')+'</ol>')
  +ref('Educational, not medical. If sleep stays broken, talk to a clinician.');
}

/* ================= registry + dispatch ================= */
const RENDER={age:renderAge,bedtime:renderBedtime,debt:renderDebt,chronotype:renderChrono,doze:renderDoze,
  polyphasic:renderPoly,caffeine:renderCaffeine,hygiene:renderHygiene,breathe:renderBreathe,papers:renderPapers};
const CLEAN={breathe:brCleanup};
function render(){
  const id=TOOLS[current].id;
  (RENDER[id]||renderAge)();
}

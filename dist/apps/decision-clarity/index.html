<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fear & Decision</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    cream: 'rgb(var(--c-cream) / <alpha-value>)',
                    'cream-dark': 'rgb(var(--c-cream-dark) / <alpha-value>)',
                    earth: 'rgb(var(--c-earth) / <alpha-value>)',
                    'earth-light': 'rgb(var(--c-earth-light) / <alpha-value>)',
                    'earth-dark': 'rgb(var(--c-earth-dark) / <alpha-value>)',
                    charcoal: 'rgb(var(--c-charcoal) / <alpha-value>)',
                    'charcoal-mid': 'rgb(var(--c-charcoal-mid) / <alpha-value>)',
                    stone: 'rgb(var(--c-stone) / <alpha-value>)',
                    accent: 'rgb(var(--c-accent) / <alpha-value>)',
                    surface: 'rgb(var(--c-surface) / <alpha-value>)',
                },
                fontFamily: {
                    serif: ['Caveat', 'cursive'],
                    hand: ['Caveat', 'cursive'],
                    sans: ['Courier Prime', 'monospace'],
                }
            }
        }
    }
</script>

<style>
    :root {
        --c-cream: 251 250 246;
        --c-cream-dark: 240 235 225;
        --c-earth: 139 111 71;
        --c-earth-light: 196 168 130;
        --c-earth-dark: 92 69 48;
        --c-charcoal: 43 41 37;
        --c-charcoal-mid: 74 69 64;
        --c-stone: 154 147 144;
        --c-accent: 179 67 43;
        --c-surface: 255 255 255;
    }
    html.dark {
        --c-cream: 27 25 21;
        --c-cream-dark: 69 63 52;
        --c-earth: 196 168 130;
        --c-earth-light: 214 190 150;
        --c-earth-dark: 214 190 150;
        --c-charcoal: 230 225 211;
        --c-charcoal-mid: 164 157 141;
        --c-stone: 124 118 106;
        --c-accent: 224 122 95;
        --c-surface: 55 51 43;
    }
    body {
        font-family: 'Courier Prime', monospace;
        background-color: rgb(var(--c-cream));
        color: rgb(var(--c-charcoal));
        background-image: radial-gradient(circle, rgba(139, 111, 71, 0.18) 1px, transparent 1.2px);
        background-size: 22px 22px;
        transition: background-color 0.5s ease, color 0.5s ease;
    }
    html.dark body {
        background-image: radial-gradient(circle, rgba(196, 168, 130, 0.12) 1px, transparent 1.2px);
    }
    .serif { font-family: 'Caveat', cursive; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
    .animate-slideUp { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    textarea { resize: none; }

    input[type="range"] {
        -webkit-appearance: none; appearance: none; height: 6px; border-radius: 999px;
        background: rgb(var(--c-cream-dark)); outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%;
        background: rgb(var(--c-earth)); cursor: pointer; border: 3px solid rgb(var(--c-cream));
        box-shadow: 0 1px 4px rgb(var(--c-charcoal) / .25);
    }
    input[type="range"]::-moz-range-thumb {
        width: 22px; height: 22px; border-radius: 50%; background: rgb(var(--c-earth));
        cursor: pointer; border: 3px solid rgb(var(--c-cream));
        box-shadow: 0 1px 4px rgb(var(--c-charcoal) / .25);
    }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgb(var(--c-charcoal)); color: rgb(var(--c-cream)); padding: 12px 20px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; z-index: 60; box-shadow: 0 8px 24px rgb(var(--c-charcoal) / .35); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .output-sticky { position: sticky; top: 16px; }

    /* section nav dots */
    .navdot { transition: background-color .2s, transform .2s; }
    .navdot.on { background: rgb(var(--c-earth)); }

    @media (max-width: 1023px) {
        .output-sticky { position: static; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<!-- Theme: follow the parent site's mode (same-origin localStorage 'wt-mode') -->
<script>
    function applyTheme() {
        var m = 'paper';
        try { m = localStorage.getItem('wt-mode') || 'paper'; } catch (e) {}
        document.documentElement.classList.toggle('dark', m === 'dark' || m === 'ice-night');
    }
    applyTheme();
    window.addEventListener('storage', function (e) { if (e.key === 'wt-mode') applyTheme(); });
</script>
</head>

<body class="min-h-screen bg-cream text-charcoal font-sans">
<main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 w-full">

    <div class="flex items-start justify-between gap-4 flex-wrap">
        <div>
            <div class="flex items-center gap-2 text-[10px] font-bold uppercase tracking-widest text-stone mb-2">
                <span class="w-1.5 h-1.5 rounded-full bg-earth"></span>
                clear decisions, not comfortable ones
            </div>
            <h1 class="serif text-5xl md:text-6xl text-charcoal leading-none" style="transform: rotate(-1deg)">Fear &amp; Decision</h1>
            <p class="mt-3 text-sm text-stone leading-relaxed max-w-2xl">
                Isi aja dari atas ke bawah, seberapa pun kamu mau. Report-nya kebentuk sendiri di samping begitu kamu mulai nulis — nggak ada tombol "next", nggak ada yang nyangkut di tengah.
            </p>
        </div>
        <div class="flex gap-2 flex-wrap">
            <button id="tabForm" class="tabx px-4 py-2 rounded-full text-xs font-bold transition-colors">Keputusan</button>
            <button id="tabHistory" class="tabx px-4 py-2 rounded-full text-xs font-bold transition-colors">Riwayat</button>
            <button id="tabHaram" class="tabx px-4 py-2 rounded-full text-xs font-bold transition-colors">Anti-Goal List</button>
        </div>
    </div>

    <div id="view" class="mt-6"></div>

    <p class="text-center text-[11px] text-stone/70 mt-10">dot-paper magic — wahyuteguh.com</p>

</main>

<div class="toast" id="toast"></div>

<script>
(function () {
    'use strict';

    var SESSION_KEY = 'wt-decision-clarity-v2';
    var HISTORY_KEY = 'wt-decision-clarity-history-v2';
    var ANTIGOALS_KEY = 'wt-decision-clarity-antigoals-v2';

    var $ = function (id) { return document.getElementById(id); };
    var view = $('view');

    /* ===================== utils ===================== */
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }
    function store(key, fallback) {
        try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
        catch (e) { return fallback; }
    }
    function persist(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
    function daysBetween(a, b) { return Math.floor((b - a) / 86400000); }
    function fmtDate(ts) {
        try { return new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(ts)); }
        catch (e) { return new Date(ts).toDateString(); }
    }
    var toastTimer = null;
    function toast(msg) {
        var t = $('toast'); t.textContent = msg; t.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
    }
    function autoGrow(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(260, ta.scrollHeight) + 'px'; }
    function clampInt(v, a, b) { v = parseInt(v, 10); if (isNaN(v)) v = a; return Math.max(a, Math.min(b, v)); }

    /* ===================== state ===================== */
    function blankSession() {
        return {
            id: '', created_at: 0, title: '', is_reversible: null,
            fear_setting: { nightmares: [], benefit_of_attempting: '', cost_of_inaction: { six_months: '', one_year: '', three_years: '' } },
            regret: { if_not_tried: 5, matters_10y: '', matters_10y_why: '', future_message: '' },
            anti_goals_triggered: [],
            outcome: ''
        };
    }
    var session = store(SESSION_KEY, null) || blankSession();
    (function normalize() {
        var b = blankSession();
        Object.keys(b).forEach(function (k) { if (session[k] == null) session[k] = b[k]; });
        if (!session.fear_setting) session.fear_setting = b.fear_setting;
        if (!session.fear_setting.cost_of_inaction) session.fear_setting.cost_of_inaction = b.fear_setting.cost_of_inaction;
        if (!Array.isArray(session.fear_setting.nightmares)) session.fear_setting.nightmares = [];
        if (!session.regret) session.regret = b.regret;
        if (!Array.isArray(session.anti_goals_triggered)) session.anti_goals_triggered = [];
    })();

    var history = store(HISTORY_KEY, []);
    var antiGoals = store(ANTIGOALS_KEY, []);
    var currentTab = 'form';

    function saveSession() { persist(SESSION_KEY, session); }
    function saveHistory() { persist(HISTORY_KEY, history); }
    function saveAntiGoals() { persist(ANTIGOALS_KEY, antiGoals); }

    /* ===================== scoring / logic ===================== */
    function computeRegretScore() {
        var base = clampInt(session.regret.if_not_tried, 1, 10);
        var m = session.regret.matters_10y;
        var mult = m === 'ya' ? 1.2 : (m === 'tidak' ? 0.7 : 1.0);
        return Math.max(1, Math.min(10, Math.round(base * mult)));
    }
    function regretExplain(score) {
        var base = clampInt(session.regret.if_not_tried, 1, 10);
        var m = session.regret.matters_10y;
        var mult = m === 'ya' ? '×1.2 (karena ini penting 10 tahun lagi)' : (m === 'tidak' ? '×0.7 (karena 10 tahun lagi nggak penting)' : '×1.0 (kamu belum yakin soal 10 tahun)');
        var tail = score >= 7
            ? 'Skor tinggi: kemungkinan kamu lebih nyesel karena <b>nggak nyoba</b> daripada karena nyoba.'
            : score <= 3
                ? 'Skor rendah: kayaknya kamu nggak bakal nyesel kalau lewatin ini.'
                : 'Skor menengah: belum jelas arahnya — mungkin kamu butuh info tambahan dulu.';
        return 'Dari skalanya (' + base + '/10) dikali ' + mult + ', terus dibulatin. ' + tail;
    }
    function completeness() {
        var checks = [];
        checks.push({ ok: !!session.title.trim(), label: 'keputusan ditulis' });
        checks.push({ ok: session.is_reversible !== null, label: 'reversibility dipilih' });
        checks.push({ ok: !!session.fear_setting.benefit_of_attempting.trim(), label: 'untung kalau dicoba' });
        checks.push({ ok: session.fear_setting.nightmares.some(function (n) { return n.scenario.trim(); }), label: 'minimal 1 skenario' });
        var costs = session.fear_setting.cost_of_inaction;
        checks.push({ ok: !!(costs.six_months || costs.one_year || costs.three_years), label: 'harga kalau diam' });
        checks.push({ ok: !!session.regret.future_message.trim(), label: 'pesan dari umur 80' });
        var done = checks.filter(function (c) { return c.ok; }).length;
        return { checks: checks, done: done, total: checks.length, pct: Math.round(done / checks.length * 100) };
    }
    function isDeep() { return session.is_reversible === false; }
    function urgencyBadge(created_at) {
        var days = daysBetween(created_at, Date.now());
        if (days < 30) return null;
        var months = Math.floor(days / 30);
        return { days: days, text: 'Udah ' + months + ' bulan sejak kamu deg-degan soal ini — masih relevan?' };
    }

    /* ===================== views ===================== */
    function setTab(t) { currentTab = t; render(); }

    function render() {
        document.querySelectorAll('.tabx').forEach(function (b) {
            var on = (b.id === 'tabForm' && currentTab === 'form') ||
                     (b.id === 'tabHistory' && currentTab === 'history') ||
                     (b.id === 'tabHaram' && currentTab === 'haram');
            b.classList.toggle('bg-charcoal', on); b.classList.toggle('text-cream', on);
            b.classList.toggle('bg-cream-dark/50', !on); b.classList.toggle('text-stone', !on);
        });
        if (currentTab === 'history') return renderHistory();
        if (currentTab === 'haram') return renderHaram();
        return renderForm();
    }

    /* ---------- single-scroll form + live output ---------- */
    function renderForm() {
        var deep = isDeep();
        view.innerHTML =
        '<div class="grid lg:grid-cols-[minmax(0,1fr)_360px] gap-6 items-start">' +

            /* ===== LEFT: the scroll ===== */
            '<div class="flex flex-col gap-5">' +

                /* 1. the decision */
                sectionCard('01', 'The decision',
                    '<label class="serif text-3xl text-charcoal block mb-2">Keputusan apa yang lagi kamu hindari?</label>' +
                    '<textarea id="f-title" rows="2" maxlength="240" placeholder="mis. Nego ulang gaji, atau resign dan mulai usaha sendiri…" class="w-full bg-cream border border-cream-dark rounded-xl p-3 text-sm text-charcoal placeholder:text-stone/70 focus:outline-none focus:border-earth transition-colors">' + esc(session.title) + '</textarea>' +
                    '<p class="text-[11px] text-stone mt-2">Tulis apa adanya. Nggak dikirim ke mana-mana — semua nyangkut di browser kamu.</p>'
                ) +

                /* 2. reversibility */
                sectionCard('02', 'Reversibility',
                    '<p class="serif text-2xl text-charcoal leading-tight mb-1">Ini pintu satu arah, atau dua arah?</p>' +
                    '<p class="text-[12px] text-stone mb-3">Kalau ternyata salah, gampang dibatalin nggak?</p>' +
                    '<div class="flex flex-col sm:flex-row gap-2" id="revWrap">' +
                        revBtn(true, 'Gampang dibalik', 'pintu dua arah — santai aja') +
                        revBtn(false, 'Susah / mahal dibalik', 'pintu satu arah — worth dipikirin serius') +
                    '</div>' +
                    (session.is_reversible === true
                        ? '<div class="mt-3 rounded-2xl bg-earth/10 border border-earth/30 p-3 text-[12px] text-charcoal leading-relaxed">Ini pintu dua arah. Biasanya nggak perlu overthinking — bagian yang berat-berat bisa kamu skip, isi yang inti aja udah cukup.</div>'
                        : '')
                ) +

                /* 3. fear-setting */
                sectionCard('03', 'Fear-setting', '' +
                    '<p class="text-[12px] text-stone mb-3">Tulis skenario buruk yang <b>spesifik</b> (bukan \"nanti gagal\"). Buat tiap skenario: gimana nyegahnya, gimana benerinnya kalau kejadian, dan seberapa masuk akal kemungkinannya.</p>' +
                    '<div id="nightmares" class="flex flex-col gap-3"></div>' +
                    '<button id="add-nightmare" class="mt-3 w-full py-2.5 rounded-2xl border-2 border-dashed border-cream-dark text-stone hover:text-charcoal hover:border-earth/50 text-xs font-bold transition-colors">+ Tambah skenario</button>' +

                    '<div class="mt-6 pt-4 border-t border-cream-dark">' +
                        '<div class="flex items-center gap-2 mb-1">' +
                            '<label class="serif text-2xl text-charcoal">Kalau dicoba, untungnya apa?</label>' +
                            '<span class="text-[9px] uppercase tracking-widest text-earth font-bold border border-earth/40 rounded-full px-2 py-0.5">penting</span>' +
                        '</div>' +
                        '<p class="text-[11px] text-stone mb-2">Walau ujungnya gagal — apa yang kamu dapet dari sekadar mencoba? Bagian ini yang bikin tool-nya nggak cuma nyorot rasa takut.</p>' +
                        '<textarea id="f-benefit" rows="2" maxlength="500" class="w-full bg-cream border border-cream-dark rounded-xl p-3 text-sm text-charcoal focus:outline-none focus:border-earth transition-colors" placeholder="mis. Aku tau batas kemampuanku, dan berhenti penasaran…">' + esc(session.fear_setting.benefit_of_attempting) + '</textarea>' +
                    '</div>' +

                    '<div class="mt-6 pt-4 border-t border-cream-dark">' +
                        '<p class="serif text-2xl text-charcoal mb-1">Kalau diam aja, harganya apa?</p>' +
                        '<p class="text-[11px] text-stone mb-3">Kalau kamu nggak ngapa-ngapain — apa yang kamu \"bayar\" di tiap titik waktu?</p>' +
                        costRow('six_months', '6 bulan') + costRow('one_year', '1 tahun') + costRow('three_years', '3 tahun') +
                    '</div>'
                ) +

                /* 4. regret */
                sectionCard('04', 'Regret minimization', '' +
                    '<div class="rounded-2xl border border-cream-dark bg-cream p-3 mb-4 flex items-center gap-3">' +
                        '<div class="w-11 h-11 rounded-full bg-earth/15 border border-earth/30 flex items-center justify-center text-xl shrink-0">🧓</div>' +
                        '<p class="text-[12px] text-charcoal leading-relaxed"><b>Bayangin kamu umur 80</b>, ngeliat ke belakang. Nilai keputusan ini dari titik itu.</p>' +
                    '</div>' +
                    '<label class="serif text-2xl text-charcoal block mb-2">Kalau nggak dicoba, seberapa nyesel kamu di umur 80?</label>' +
                    '<div class="flex items-center gap-3 mb-5">' +
                        '<input id="r-scale" type="range" min="1" max="10" step="1" value="' + session.regret.if_not_tried + '" class="flex-1">' +
                        '<span id="r-scale-v" class="serif text-3xl text-earth w-10 text-right">' + session.regret.if_not_tried + '</span>' +
                    '</div>' +
                    '<label class="serif text-2xl text-charcoal block mb-2">10 tahun lagi, ini masih penting nggak?</label>' +
                    '<div class="flex gap-2 flex-wrap mb-2">' + ['ya', 'mungkin', 'tidak'].map(function (v) {
                        var on = session.regret.matters_10y === v;
                        return '<button data-10y="' + v + '" class="px-4 py-2 rounded-full text-xs font-bold transition-colors ' + (on ? 'bg-charcoal text-cream' : 'bg-cream-dark/50 text-stone hover:bg-cream-dark') + '">' + v.charAt(0).toUpperCase() + v.slice(1) + '</button>';
                    }).join('') + '</div>' +
                    '<textarea id="r-why" rows="1" maxlength="300" placeholder="kenapa? singkat aja…" class="w-full bg-cream border border-cream-dark rounded-xl p-3 text-sm text-charcoal placeholder:text-stone/60 focus:outline-none focus:border-earth mb-5">' + esc(session.regret.matters_10y_why) + '</textarea>' +
                    '<label class="serif text-2xl text-charcoal block mb-2">Mau bilang apa ke dirimu yang sekarang, dari umur 80?</label>' +
                    '<textarea id="r-msg" rows="3" maxlength="600" class="w-full bg-cream border border-cream-dark rounded-xl p-3 text-sm text-charcoal focus:outline-none focus:border-earth" placeholder="Tulis kayak beneran dari dirimu yang udah tua…">' + esc(session.regret.future_message) + '</textarea>' +
                    '<div class="mt-4 rounded-2xl border border-earth/30 bg-earth/5 p-3">' +
                        '<div class="flex items-baseline gap-2"><span class="text-[10px] font-bold uppercase tracking-widest text-earth">regret score</span><span id="r-score" class="serif text-3xl text-earth ml-auto">' + computeRegretScore() + '</span><span class="text-sm text-stone">/ 10</span></div>' +
                        '<p id="r-explain" class="text-[11px] text-charcoal-mid leading-relaxed mt-1">' + regretExplain(computeRegretScore()) + '</p>' +
                    '</div>'
                ) +

                /* 5. anti-goals */
                sectionCard('05', 'Anti-goals', '' +
                    '<p class="text-[12px] text-stone mb-3">Inversion: daripada nanya \"gimana biar sukses\", nanya \"gimana biar gagal total\" — terus hindari itu. Bikin anti-goal dari hal yang mau kamu lindungi.</p>' +
                    '<div class="flex gap-2 mb-3">' +
                        '<input id="ag-value" type="text" maxlength="60" placeholder="mis. Kesehatan, waktu keluarga, integritas…" class="flex-1 min-w-0 bg-cream border border-cream-dark rounded-xl px-3 py-2 text-sm text-charcoal placeholder:text-stone/60 focus:outline-none focus:border-earth">' +
                        '<button id="ag-add" class="px-4 py-2 rounded-full bg-earth text-cream hover:bg-earth-dark text-xs font-bold transition-colors">Bikin</button>' +
                    '</div>' +
                    '<p class="text-[11px] text-stone mb-3">Anti-goal kesimpen di <b>Anti-Goal List</b> — nggak hilang, nambah terus tiap sesi.</p>' +
                    '<div id="ag-picks" class="flex flex-col gap-2"></div>'
                ) +

            '</div>' +

            /* ===== RIGHT: live output ===== */
            '<div class="output-sticky">' +
                '<div class="bg-surface border border-cream-dark rounded-3xl shadow-sm p-5">' +
                    '<div class="flex items-center justify-between mb-3">' +
                        '<span class="text-[10px] font-bold uppercase tracking-widest text-stone">report kamu · live</span>' +
                        '<span id="c-pct" class="text-[11px] font-bold text-earth"></span>' +
                    '</div>' +
                    '<div class="w-full h-1.5 rounded-full bg-cream-dark overflow-hidden mb-3">' +
                        '<div id="c-bar" class="h-full rounded-full bg-earth transition-all duration-300" style="width:0%"></div>' +
                    '</div>' +
                    '<div id="c-checks" class="flex flex-wrap gap-1.5 mb-4"></div>' +
                    '<div id="out-actions" class="grid grid-cols-2 gap-2 mb-4">' +
                        '<button id="b-copy" class="px-3 py-2 rounded-full bg-earth text-cream hover:bg-earth-dark text-[11px] font-bold transition-colors">Copy prompt</button>' +
                        '<button id="b-download" class="px-3 py-2 rounded-full bg-cream-dark/50 hover:bg-cream-dark text-[11px] font-bold transition-colors">Download .md</button>' +
                    '</div>' +
                    '<div id="out-preview" class="text-[11px] text-charcoal-mid leading-relaxed max-h-[42vh] overflow-y-auto border-t border-cream-dark pt-3"></div>' +
                    '<div class="mt-4 pt-3 border-t border-cream-dark flex items-center gap-2">' +
                        '<button id="b-new" class="text-[11px] font-bold text-earth hover:underline underline-offset-2">Mulai keputusan baru</button>' +
                        '<button id="b-reset" class="ml-auto text-[11px] text-stone hover:text-accent">↻ Kosongkan</button>' +
                    '</div>' +
                '</div>' +
            '</div>' +

        '</div>';

        bindForm();
        renderNightmares();
        renderAgPicks();
        updateOutput();
    }

    function sectionCard(num, title, inner) {
        return '<section class="bg-surface border border-cream-dark rounded-3xl shadow-sm p-5 sm:p-6">' +
            '<div class="flex items-center gap-3 mb-3">' +
                '<span class="serif text-3xl text-earth leading-none">' + num + '</span>' +

    function bindForm() {
        var t = $('f-title'); if (t) { autoGrow(t); t.addEventListener('input', function () { session.title = t.value; autoGrow(t); saveSession(); updateOutput(); }); }

        var add = $('add-nightmare'); if (add) add.addEventListener('click', function () { session.fear_setting.nightmares.push({ scenario: '', prevent: '', repair: '', probability_1to10: 5 }); saveSession(); renderNightmares(); updateOutput(); });
        var sc = $('r-scale'); if (sc) sc.addEventListener('input', function () { session.regret.if_not_tried = clampInt(sc.value, 1, 10); $('r-scale-v').textContent = session.regret.if_not_tried; refreshScore(); saveSession(); updateOutput(); });

        var agv = $('ag-value');
        var agadd = $('ag-add');
        if (agadd) agadd.addEventListener('click', function () {
            var v = agv.value.trim(); if (!v) { agv.focus(); return; }

            antiGoals.push(ag); saveAntiGoals(); openAntiGoalEditor(ag, true);
        });
        var w = $('revWrap');
        if (w) w.querySelectorAll('[data-rev]').forEach(function (b) {
            b.addEventListener('click', function () {
                session.is_reversible = b.getAttribute('data-rev') === 'true';

                saveSession(); renderForm();
            });
        });

        var br = $('b-reset'); if (br) br.addEventListener('click', function () { if (!confirm('Kosongin form dan mulai dari nol?')) return; session = blankSession(); saveSession(); render(); });
        $('b-copy').addEventListener('click', function () { copyText(buildPrompt(), this, 'Tersalin!'); });
        $('b-download').addEventListener('click', downloadMd);
    }
    function refreshScore() {
        var s = computeRegretScore();
        var el = $('r-score'); if (el) el.textContent = s;
        var ex = $('r-explain'); if (ex) ex.textContent = regretExplain(s);
    }

    /* ---------- live output panel ---------- */
    function updateOutput() {
        var c = completeness();
        var pct = $('c-pct'); if (pct) pct.textContent = c.done + '/' + c.total + ' terisi';
        var bar = $('c-bar'); if (bar) bar.style.width = c.pct + '%';
        var checks = $('c-checks');
        if (checks) checks.innerHTML = c.checks.map(function (chk) {
            return '<span class="text-[9px] uppercase tracking-wider px-2 py-0.5 rounded-full border ' + (chk.ok ? 'border-earth/40 bg-earth/10 text-earth' : 'border-cream-dark text-stone') + '">' + (chk.ok ? '✓ ' : '') + chk.label + '</span>';
        }).join('');
        var prev = $('out-preview');
        if (prev) prev.innerHTML = outputPreviewHTML();
    }
    function outputPreviewHTML() {
        var s = session;
        if (!s.title.trim() && !s.fear_setting.benefit_of_attempting && !s.regret.future_message) {
            return '<p class="italic text-stone">Report-nya kebentuk otomatis begitu kamu mulai nulis. Nggak ada tombol simpan — ini langsung hidup.</p>';
        }
        var out = [];
        if (s.title.trim()) out.push('<div class="font-bold text-charcoal text-[13px] mb-1">' + esc(s.title) + '</div>');
        out.push('<div class="text-[10px] uppercase tracking-widest text-stone mb-2">' + (s.is_reversible === false ? 'pintu satu arah' : s.is_reversible === true ? 'pintu dua arah' : 'reversibility —') + '</div>');
        var nms = s.fear_setting.nightmares.filter(function (n) { return n.scenario.trim(); });
        if (nms.length) out.push('<div class="mb-2"><span class="text-stone">Skenario:</span> ' + nms.map(function (n) { return esc(n.scenario) + ' <span class="text-earth">(' + n.probability_1to10 + '/10)</span>'; }).join(' · ') + '</div>');
        if (s.fear_setting.benefit_of_attempting) out.push('<div class="mb-2"><span class="text-stone">Untungnya dicoba:</span> ' + esc(s.fear_setting.benefit_of_attempting) + '</div>');
        var co = s.fear_setting.cost_of_inaction;
        if (co.six_months || co.one_year || co.three_years) out.push('<div class="mb-2"><span class="text-stone">Kalau diam:</span> ' + [co.six_months ? '6bln ' + esc(co.six_months) : '', co.one_year ? '1thn ' + esc(co.one_year) : '', co.three_years ? '3thn ' + esc(co.three_years) : ''].filter(Boolean).join(' · ') + '</div>');
        if (s.regret.future_message) out.push('<div class="mb-2"><span class="text-stone">Pesan dari umur 80:</span> <span class="italic">' + esc(s.regret.future_message) + '</span></div>');
        var linked = antiGoals.filter(function (ag) { return s.anti_goals_triggered.indexOf(ag.id) !== -1; });
        if (linked.length) out.push('<div><span class="text-stone">Anti-goal:</span> ' + linked.map(function (a) { return esc(a.label); }).join(', ') + '</div>');
        out.push('<div class="mt-3 pt-2 border-t border-cream-dark flex items-center justify-between"><span class="text-stone">Regret score</span><span class="text-earth font-bold">' + computeRegretScore() + '/10</span></div>');
        return out.join('');

    /* ---------- anti-goal editor ---------- */
    function openAntiGoalEditor(ag, isNew) {

        overlay.className = 'fixed inset-0 bg-charcoal/40 backdrop-blur-sm z-50 flex items-center justify-center p-4';
        overlay.innerHTML =
            '<div class="bg-surface border border-cream-dark rounded-[2rem] max-w-lg w-full p-6 shadow-2xl animate-slideUp max-h-[92vh] overflow-y-auto">' +
                '<div class="text-[10px] font-bold uppercase tracking-widest text-stone">anti-goal</div>' +
                '<input id="ago-label" value="' + esc(ag.label) + '" maxlength="60" placeholder="mis. Burnout" class="w-full serif text-3xl bg-transparent text-charcoal focus:outline-none mt-1 mb-3 border-b border-cream-dark pb-1">' +
                '<label class="text-[10px] font-bold uppercase tracking-widest text-stone">Hal bodoh apa yang <b>pasti bikin</b> ini kejadian?</label>' +

                '<div class="mt-4 rounded-2xl border border-accent/40 bg-accent/5 p-3">' +

                    '<div class="flex items-center gap-2"><span class="text-[12px] text-charcoal whitespace-nowrap">Aku tau ini mulai kejadian kalau</span>' +
                    '<input id="ago-trigger" value="' + esc(ag.trigger) + '" maxlength="200" placeholder="…" class="flex-1 min-w-0 bg-cream border border-cream-dark rounded-lg px-2 py-1.5 text-[12px] text-charcoal focus:outline-none focus:border-earth"></div>' +
                '</div>' +
                '<div class="mt-4"><div class="text-[10px] font-bold uppercase tracking-widest text-stone mb-2">Not-to-do list <span class="normal-case font-normal">(kebalikannya, otomatis)</span></div><div id="ago-ntd" class="text-[12px] text-charcoal-mid"></div></div>' +
                '<div class="flex justify-end gap-2 mt-6">' +

                '</div>' +
            '</div>';
        document.body.appendChild(overlay);

        function renderEditor() {
            var host = overlay.querySelector('#ago-dumb');
            host.innerHTML = ag.dumb_actions.map(function (d, i) {
                return '<div class="flex items-center gap-2"><span class="text-[11px] text-stone">•</span>' +
                    '<input data-dumb="' + i + '" value="' + esc(d) + '" maxlength="160" placeholder="mis. nggak pernah off, terus kerja…" class="flex-1 bg-cream border border-cream-dark rounded-lg px-2 py-1.5 text-[12px] text-charcoal focus:outline-none focus:border-earth">' +
                    '<button data-ddumb="' + i + '" class="text-stone hover:text-accent"><svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';
            }).join('');
            host.querySelectorAll('[data-dumb]').forEach(function (inp) { inp.addEventListener('input', function () { ag.dumb_actions[+inp.dataset.dumb] = inp.value; renderNtd(); }); });
            host.querySelectorAll('[data-ddumb]').forEach(function (b) { b.addEventListener('click', function () { ag.dumb_actions.splice(+b.dataset.ddumb, 1); renderEditor(); renderNtd(); }); });
            renderNtd();
        }
        function renderNtd() {
            var list = ag.dumb_actions.filter(function (x) { return x.trim(); }).map(function (d) { return '<div class="flex items-start gap-2 py-1"><span class="text-accent font-bold">✕</span><span>' + esc(negate(d)) + '</span></div>'; }).join('');

            ag.label = overlay.querySelector('#ago-label').value.trim() || 'Anti-Goal';
            ag.trigger = overlay.querySelector('#ago-trigger').value.trim();

            ag.not_to_do = ag.dumb_actions.filter(function (x) { return x.trim(); }).map(negate);
            if (!antiGoals.some(function (x) { return x.id === ag.id; })) antiGoals.push(ag);
            else antiGoals = antiGoals.map(function (x) { return x.id === ag.id ? ag : x; });
            saveAntiGoals(); overlay.remove(); toast(isNew ? 'Anti-goal dibuat' : 'Tersimpan'); render();
        });
    }
    function negate(action) {
        var a = String(action).trim().replace(/\.$/, '');
        if (/^(nggak|tidak|jangan)\b/i.test(a)) return a.charAt(0).toUpperCase() + a.slice(1) + '.';
        return 'Jangan: ' + a + '.';
    }

    /* ---------- export ---------- */
    function copyText(text, btn, okLabel) {
        var done = function () { var o = btn.textContent; btn.textContent = okLabel || 'Tersalin!'; setTimeout(function () { btn.textContent = o; }, 1600); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
        else { fallbackCopy(text); done(); }
    }
    function fallbackCopy(text) {
        var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove();
    }
    function downloadMd() {
        var blob = new Blob([buildMarkdown()], { type: 'text/markdown' });
        var a = document.createElement('a');

        document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);

    function buildPrompt() {

        if (nms.length) nms.forEach(function (n) { L.push('- ' + n.scenario + ' → cegah: ' + (n.prevent || '-') + ' → perbaiki: ' + (n.repair || '-') + ' → kemungkinan: ' + n.probability_1to10 + '/10'); });
        else L.push('- (belum diisi)');

        L.push('Pesan dari diriku di 80 tahun: ' + (s.regret.future_message || '(belum diisi)'));
        L.push('');
        L.push('ANTI-GOALS yang relevan:');

        if (linked.length) linked.forEach(function (ag) { L.push('- ' + ag.label + ': aku tahu ini kejadian kalau ' + (ag.trigger || '(trigger kosong)') + '. Yang harus aku hindari: ' + (ag.not_to_do.join('; ') || '(belum ada)')); });
        else L.push('- (belum ada)');
        L.push('');
        L.push('Berdasarkan semua ini, bantu aku lihat blind spot apa yang mungkin aku lewatkan, dan apa pertanyaan lanjutan yang harus aku jawab sebelum benar-benar memutuskan.');
        return L.join('\n');
    }
    function buildMarkdown() {
        var s = session, c = s.fear_setting.cost_of_inaction, M = [];
        M.push('# Fear & Decision — ' + (s.title || '(tanpa judul)'));
        M.push('');
        M.push('- **Reversibility:** ' + (s.is_reversible === false ? 'pintu satu arah (irreversible)' : s.is_reversible === true ? 'pintu dua arah (reversible)' : '—'));

        M.push('');
        M.push('## Fear-Setting');
        M.push('');
        M.push('### Nightmares');
        var nms = s.fear_setting.nightmares.filter(function (n) { return n.scenario.trim(); });
        if (nms.length) nms.forEach(function (n, i) {
            M.push((i + 1) + '. **' + n.scenario + '**');
            M.push('   - Cegah: ' + (n.prevent || '-'));
            M.push('   - Perbaiki: ' + (n.repair || '-'));
            M.push('   - Seberapa mungkin: ' + n.probability_1to10 + '/10');
        }); else M.push('_(belum diisi)_');
        M.push('');
        M.push('### Benefit of Attempting');
        M.push('');
        M.push(s.fear_setting.benefit_of_attempting || '_(belum diisi)_');
        M.push('');
        M.push('### Cost of Inaction');
        M.push('');
        M.push('- **6 bulan:** ' + (c.six_months || '-'));
        M.push('- **1 tahun:** ' + (c.one_year || '-'));
        M.push('- **3 tahun:** ' + (c.three_years || '-'));
        M.push('');
        M.push('## Regret Minimization');
        M.push('');
        M.push('**Regret Score:** ' + computeRegretScore() + '/10');
        M.push('');
        M.push('> ' + regretExplain(computeRegretScore()));
        M.push('');
        M.push('**Penting dalam 10 tahun?** ' + (s.regret.matters_10y || '—') + (s.regret.matters_10y_why ? ' — ' + s.regret.matters_10y_why : ''));
        M.push('');
        M.push('**Pesan dari dirimu di umur 80:**');
        M.push('');
        M.push(s.regret.future_message || '_(belum diisi)_');
        M.push('');
        M.push('## Anti-Goals');
        M.push('');
        var linked = antiGoals.filter(function (ag) { return s.anti_goals_triggered.indexOf(ag.id) !== -1; });
        if (linked.length) linked.forEach(function (ag) {
            M.push('### ' + ag.label);
            M.push('');
            M.push('- **Trigger:** ' + (ag.trigger || '-'));
            ag.not_to_do.forEach(function (n) { M.push('- ' + n); });
            M.push('');
        }); else M.push('_(belum ada)_');
        return M.join('\n');
    }
    function archiveSession() {
        if (!session.title.trim()) return;
        if (!session.id) { session.id = uid(); session.created_at = Date.now(); }
        var copy = JSON.parse(JSON.stringify(session)); copy.completed_at = Date.now();
        var exists = history.some(function (h) { return h.id === copy.id; });
        history = exists ? history.map(function (h) { return h.id === copy.id ? Object.assign(h, copy) : h; }) : [copy].concat(history);
        saveHistory();
    }

    /* ---------- history ---------- */
    function renderHistory() {
        if (!history.length) { view.innerHTML = card('<p class="text-center text-stone py-6">Belum ada keputusan tersimpan. Isi satu di tab Keputusan, terus klik \"Mulai keputusan baru\".</p>'); return; }
        view.innerHTML = history.map(function (h, idx) {
            var badge = urgencyBadge(h.created_at);
            return '<div class="bg-surface border border-cream-dark rounded-3xl shadow-sm p-5 mb-4">' +
                '<div class="flex items-start justify-between gap-3">' +
                    '<div class="min-w-0">' +
                        '<div class="serif text-2xl text-charcoal leading-tight">' + esc(h.title) + '</div>' +
                        '<div class="text-[11px] text-stone mt-1">' + fmtDate(h.created_at) + ' · ' + (h.is_reversible === false ? 'pintu satu arah' : h.is_reversible === true ? 'pintu dua arah' : '—') + ' · skor ' + scoreOf(h) + '/10</div>' +
                    '</div>' +
                    '<button data-open="' + idx + '" class="shrink-0 text-[11px] font-bold text-earth hover:underline underline-offset-2">buka</button>' +
                '</div>' +
                (h.outcome ? '<div class="mt-3 rounded-2xl bg-earth/5 border border-earth/30 p-3"><div class="text-[10px] font-bold uppercase tracking-widest text-earth mb-1">gimana kenyataannya</div><p class="text-[13px] text-charcoal">' + esc(h.outcome) + '</p></div>' : '') +
                (badge && !h.outcome ? '<button data-followup="' + idx + '" class="mt-3 w-full text-left rounded-2xl bg-accent/5 border border-accent/40 p-3 hover:bg-accent/10 transition-colors"><span class="text-[12px] text-accent font-bold">' + badge.text + '</span> <span class="text-[11px] text-stone">klik buat isi hasilnya →</span></button>' : '') +
            '</div>';
        }).join('');
        view.querySelectorAll('[data-open]').forEach(function (b) { b.addEventListener('click', function () { session = JSON.parse(JSON.stringify(history[+b.dataset.open])); saveSession(); currentTab = 'form'; toast('Keputusan dibuka'); render(); }); });
        view.querySelectorAll('[data-followup]').forEach(function (b) { b.addEventListener('click', function () { var h = history[+b.dataset.followup]; var out = prompt('Gimana kenyataannya? (kejadian apa, pelajaran apa)', h.outcome || ''); if (out == null) return; h.outcome = out.trim(); saveHistory(); render(); toast('Hasil kesimpen'); }); });
    }
    function scoreOf(d) {
        var base = clampInt(d.regret && d.regret.if_not_tried, 1, 10);
        var m = d.regret && d.regret.matters_10y;
        var mult = m === 'ya' ? 1.2 : (m === 'tidak' ? 0.7 : 1.0);
        return Math.max(1, Math.min(10, Math.round(base * mult)));
    }

    /* ---------- standing anti-goals ---------- */
    function renderHaram() {
        view.innerHTML = '<div class="bg-surface border border-cream-dark rounded-3xl shadow-sm p-5 sm:p-6">' +
            '<div class="flex items-start justify-between gap-3 mb-1">' +
                '<div><div class="text-[10px] font-bold uppercase tracking-widest text-stone">standing list</div>' +
                '<p class="serif text-3xl text-charcoal leading-tight">Anti-Goal List</p>' +
                '<p class="text-[11px] text-stone mt-1">Anti-goal yang nggak hilang, nambah terus tiap sesi. Inversion: hindari jalannya gagal.</p></div>' +
                '<button id="h-add" class="shrink-0 px-4 py-2 rounded-full bg-earth text-cream hover:bg-earth-dark text-xs font-bold transition-colors">+ Anti-goal</button>' +
            '</div>' +
            (antiGoals.length ? '<div class="flex flex-col gap-3 mt-4">' + antiGoals.map(agCard).join('') + '</div>'
                : '<p class="text-center text-stone py-6 italic">Belum ada anti-goal. Bikin satu — mulai dari hal yang mau kamu lindungi.</p>') +
        '</div>';
        $('h-add').addEventListener('click', function () { var ag = { id: uid(), label: '', dumb_actions: [''], trigger: '', not_to_do: [] }; antiGoals.push(ag); saveAntiGoals(); openAntiGoalEditor(ag, true); });
        view.querySelectorAll('[data-hedit]').forEach(function (b) { b.addEventListener('click', function () { var ag = antiGoals.filter(function (x) { return x.id === b.dataset.hedit; })[0]; if (ag) openAntiGoalEditor(ag, false); }); });
        view.querySelectorAll('[data-hdel]').forEach(function (b) { b.addEventListener('click', function () { if (!confirm('Hapus anti-goal ini?')) return; antiGoals = antiGoals.filter(function (x) { return x.id !== b.dataset.hdel; }); saveAntiGoals(); render(); }); });
    }
    function agCard(ag) {
        var ready = ag.trigger && ag.trigger.trim();
        return '<div class="bg-cream border ' + (ready ? 'border-cream-dark' : 'border-accent/40') + ' rounded-2xl p-4">' +
            '<div class="flex items-start justify-between gap-3">' +
                '<div class="min-w-0"><div class="text-[10px] font-bold uppercase tracking-widest text-stone">anti-goal</div>' +
                '<div class="serif text-2xl text-charcoal leading-tight">' + esc(ag.label || '(tanpa nama)') + '</div></div>' +
                '<div class="flex items-center gap-2 shrink-0">' +
                    '<button data-hedit="' + ag.id + '" class="text-[11px] font-bold text-earth hover:underline underline-offset-2">edit</button>' +
                    '<button data-hdel="' + ag.id + '" class="text-stone hover:text-accent" aria-label="Hapus"><svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
                '</div>' +
            '</div>' +
            (ready ? '<div class="mt-2 text-[13px]"><span class="text-[10px] uppercase tracking-widest text-stone">trigger</span><div class="text-charcoal-mid">Aku tau ini mulai kejadian kalau ' + esc(ag.trigger) + '</div></div>' : '<div class="mt-2 text-[12px] text-accent font-bold">Trigger-nya belum diisi — klik edit.</div>') +
            (ag.not_to_do.length ? '<div class="mt-2"><span class="text-[10px] uppercase tracking-widest text-stone">not-to-do</span><ul class="mt-1">' + ag.not_to_do.map(function (n) { return '<li class="text-[13px] text-charcoal"><span class="text-accent font-bold">✕</span> ' + esc(n) + '</li>'; }).join('') + '</ul></div>' : '') +
        '</div>';
    }

    function card(inner) { return '<div class="bg-surface border border-cream-dark rounded-3xl shadow-sm p-5 sm:p-7 animate-fadeIn">' + inner + '</div>'; }

    /* ===================== boot ===================== */
    $('tabForm').addEventListener('click', function () { setTab('form'); });
    $('tabHistory').addEventListener('click', function () { setTab('history'); });
    $('tabHaram').addEventListener('click', function () { setTab('haram'); });
    render();
})();
</script>
</body>
</html>
